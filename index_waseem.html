}

    border-color:#00e5ff;
    box-shadow:0 0 25px rgba(0,229,255,.2);
}

#search-button{
    border:none;
    background:linear-gradient(135deg,#00e5ff,#7c3aed);
    color:white;
    padding:0 30px;
    border-radius:18px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    transition:.3s ease;
    box-shadow:0 10px 30px rgba(0,229,255,.25);
}

#search-button:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 35px rgba(124,58,237,.35);
}

#status{
    margin-bottom:20px;
    padding:16px;
    border-radius:16px;
    text-align:center;

    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.06);
}

#results-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));

    margin-top:20px;
}

.emoji-item-wrapper{
    margin:0;
    width:100%;
}

.emoji-item{
    min-height:130px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    font-size:2.6rem;
    cursor:pointer;
    transition:.35s ease;
    position:relative;
    overflow:hidden;
    box-shadow:
    inset 0 1px 1px rgba(255,255,255,.05),
    0 10px 25px rgba(0,0,0,.35);
}

.emoji-item::before{
    content:'';
    position:absolute;
    width:140%;
    height:140%;
    background:linear-gradient(135deg,transparent,rgba(255,255,255,.08),transparent);
    transform:rotate(25deg);
    top:-120%;
    left:-120%;
    transition:.5s ease;
}

.emoji-item:hover::before{
    top:100%;
    left:100%;
}

.emoji-item:hover{
    transform:translateY(-8px) scale(1.03);
    border-color:#00e5ff;
    box-shadow:
    0 0 30px rgba(0,229,255,.18),

}

#whatsapp-container{

#whatsapp-link{

#whatsapp-link:hover{

#copy-notification{
    position:fixed;
    top:40px;
    right:40px;

    color:white;

    border-radius:16px;
    font-weight:700;
    opacity:0;
    visibility:hidden;
    transition:.35s ease;
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

#copy-notification.show{
    opacity:1;
    visibility:visible;
}

    #theme-toggle-container{

<body class="dark-mode"> 

    <div id="theme-toggle-container">
        <button id="theme-toggle">☀️ Light Mode</button>
    </div>

    <div class="container">
        <header>
            <h1>WASEEM 𓆩𝐒𝐘𝐌𝐁𝐎𝐋𝐒𓆪 </h1>
            <div id="made-by">A service by WASEEM TOOLS</div>
        </header>
        
        <div id="guidance-message">
            <p>Welcome! Enter a search keyword (e.g., "STAR", "GUN") to begin exploring.</p>
        </div>
        
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Enter your keyword here..." value="">
            <button id="search-button">
                Search
            </button>
        </div>

        <div id="status" class="">Awaiting user input...</div>

        <div id="results-container" style="display: none;">
            
        </div>

        <div id="whatsapp-container">
            <a id="whatsapp-link" href="https://whatsapp.com/channel/0029VbD4m3ZFCCoWbOzY3x2S" target="_blank">
                Join Our WhatsApp Channel For Update at 10x speed
            </a>
        </div>
    </div>

    <div id="copy-notification">Copied!</div>

    


<script>
        const API_URL = 'https://characters.fakcloud.tech/';
        const WHATSAPP_CHANNEL = 'https://whatsapp.com/channel/0029VbD4m3ZFCCoWbOzY3x2S';

        // DOM Elements
        const body = document.body;
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const statusDiv = document.getElementById('status');
        const resultsContainer = document.getElementById('results-container');
        const copyNotification = document.getElementById('copy-notification');
        const guidanceMessage = document.getElementById('guidance-message');
        const themeToggle = document.getElementById('theme-toggle');

        // =======================================================
        // Theme Logic
        // =======================================================
        function toggleTheme() {
            if (body.classList.contains('dark-mode')) {
                // Switch to Light Mode
                body.classList.remove('dark-mode');
                body.classList.add('light-mode');
                themeToggle.textContent = '🌙 Dark Mode';
                localStorage.setItem('theme', 'light');
            } else {
                // Switch to Dark Mode
                body.classList.remove('light-mode');
                body.classList.add('dark-mode');
                themeToggle.textContent = '☀️ Light Mode';
                localStorage.setItem('theme', 'dark');
            }
        }
        
        // Initialize Theme from localStorage or default to dark
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'dark'; // Default to dark as requested
            if (savedTheme === 'light') {
                body.classList.remove('dark-mode');
                body.classList.add('light-mode');
                themeToggle.textContent = '🌙 Dark Mode';
            } else {
                 body.classList.add('dark-mode'); // Ensure default is set
                 themeToggle.textContent = '☀️ Light Mode';
            }

            // Initial UI Setup
            searchInput.value = '';
            statusDiv.textContent = 'Awaiting user input...';
            statusDiv.className = '';
            resultsContainer.style.display = 'none';
        });

        // Event Listeners
        searchButton.addEventListener('click', fetchCharacters);
        searchInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                fetchCharacters();
            }
        });
        themeToggle.addEventListener('click', toggleTheme);

        // =======================================================
        // 1. DATA FETCHING
        // =======================================================

        async function fetchCharacters() {
            const query = searchInput.value.trim();
            if (!query) {
                // If no query, redirect to WhatsApp as per API logic
                window.location.href = WHATSAPP_CHANNEL;
                return; 
            }
            
            guidanceMessage.style.display = 'none';
            resultsContainer.style.display = 'block';

            // UI State: Loading
            setStatus('loading', `Searching for "${query}"...`);
            resultsContainer.innerHTML = '';
            searchButton.disabled = true;

            const url = `${API_URL}?q=${encodeURIComponent(query)}`;

            try {
                const response = await fetch(url);
                
                // Handle 302 Redirect from the Worker (API error/bad input)
                if (response.status === 302) {
                    const finalUrl = response.headers.get('Location') || WHATSAPP_CHANNEL;
                    setStatus('error', `Navigation error detected. Redirecting to WhatsApp Channel...`);
                    setTimeout(() => window.location.href = finalUrl, 1000);
                    return;
                }

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || `API returned status ${response.status}`);
                }

                displayResults(data.emojis, query);

            } catch (error) {
                console.error("Fetch Error:", error);
                setStatus('error', `Connection Error. Please check the API endpoint or try again.`);
            } finally {
                searchButton.disabled = false;
            }
        }

        // =======================================================
        // 2. RESULTS DISPLAY (Masonry & Content Fix)
        // =======================================================

        function displayResults(emojis, query) {
            resultsContainer.innerHTML = ''; 

            if (emojis.length === 0) {
                return setStatus('error', `No characters found for "${query}".`);
            }
            
            emojis.forEach(char => {
                const wrapper = document.createElement('div');
                wrapper.className = 'emoji-item-wrapper';

                const item = document.createElement('div');
                item.className = 'emoji-item';

                // Decode entities and display as HTML to render characters correctly
                item.innerHTML = char.replace(/&amp;/g, '&')
                                     .replace(/&lt;/g, '<')
                                     .replace(/&gt;/g, '>');

                item.onclick = () => copyToClipboard(char); 
                
                wrapper.appendChild(item);
                resultsContainer.appendChild(wrapper);
            });

            setStatus('success', `${emojis.length} results loaded for "${query}". Click on a box to copy the character!`);
        }

        // =======================================================
        // 3. UTILITIES (Copy & Status)
        // =======================================================

        function setStatus(type, message) {
            statusDiv.textContent = message;
            statusDiv.className = ''; 
            
            // Add base and type-specific classes
            statusDiv.classList.add('p-4', 'rounded-lg', 'font-semibold', 'mb-4', type);
        }

        // --- Copy Function with Fallback (Tested and Robust) ---
        async function copyToClipboard(text) {
            let success = false;
            
            // 1. Modern Clipboard API
            try {
                await navigator.clipboard.writeText(text);
                success = true;
            } catch (err) {
                // 2. Fallback via document.execCommand
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed'; 
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    success = document.execCommand('copy');
                } catch (execErr) {
                    // Final fail state
                }
                document.body.removeChild(textArea);
            }

            if (success) {
                const display = text.length > 25 ? text.substring(0, 25).trim() + '...' : text;
                showCopyNotification(`'${display}' copied!`);
            } else {
                showCopyNotification('Copy failed. Manual selection is required.');
            }
        }

        let notificationTimeout;
        function showCopyNotification(message) {
            clearTimeout(notificationTimeout);
            copyNotification.textContent = message;
            copyNotification.classList.add('show');
            
            notificationTimeout = setTimeout(() => {
                copyNotification.classList.remove('show');
            }, 1200);
        }
    </script>
